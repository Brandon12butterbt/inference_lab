[project]
name = "inference-lab"
version = "0.1.0"
authors = [
    { name = "Brandon12butterbt", email = "brandontbutterworth@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas==2.2.3",
    "psutil>=7.2.2",
    "streamlit>=1.66.1",
    "torch>=2.11.0",
    "transformers>=5.22.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
